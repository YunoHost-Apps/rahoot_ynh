#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "razzia"
name = "Razzia"
description.en = "Quiz platform for smaller events"
description.fr = "Plateforme de quiz pour les petits événements"

version = "3.1.0~ynh2"

maintainers = ["Thovi98"]

[upstream]
license = "MIT"
code = "https://github.com/Ralex91/Razzia"
fund = "https://ko-fi.com/Ralex91"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = false # can't be true because of fixed Web Socket port

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.password]
    type = "password"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/Ralex91/Razzia/archive/refs/tags/3.1.0.tar.gz"
    sha256 = "316fd3e0c26ad920cdd24d2ac56e780fe8135d196ffdc3df9fd463b934fac3a9"

    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]
    
    [resources.permissions]
    main.url = "/"

    [resources.ports]
	main.default = 3001    # Upstream WS need Port 3001
	main.fixed = true
	
    [resources.nodejs]
    version = "24"
